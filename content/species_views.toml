# 物种页的三视图（人工维护）
#
# 每种蘑菇固定三张辨认用照片：顶面、下面、基部。物种页只靠这三张把外形说清楚；
# 自测题仍用 seasonal_edibles.json 里按票数取的照片池。3D 模型是加分项，不是标配。
#
# 三张分别是：
#   top        顶面——菌盖上面（架状菌看上表面，马勃看外形）
#   underside  下面——菌褶 / 菌孔 / 菌刺 / 孔面；马勃、羊肚菌等看竖切面
#   base       基部——菌柄基部、菌托、着生处；没有柄的看贴在木头或地上的那一头
#
# species  物种页学名（content/species.toml 里的条目）
# *.id     iNat 照片 id
# *.obs    这张照片所在的 iNat 观察 id
# *.taxon  观察现在的学名，拉取时核对
# *.note   照片下面一句：这张上看什么

