note = "高高的菌盖上翻着一片片鳞片。转到下面看：菌柄顶端有一圈小菌环，菌褶已经开始变黑。基部的金属针是扫描时固定用的。"

[[model]]
species = "Hydnum"
uid = "d68a9bff24f94898a230c39e833cdbbc"
