# 物种档案（人工维护）
#
# name       iNat 学名；可以是种，也可以是属（属条目覆盖该属下没有单独条目的种）
# edibility  edible 可食 / cook 需彻底煮熟 / expert 新手不吃 / avoid 不推荐 / toxic 有毒 / deadly 致命
# habitat    生境（地点、季节、基物）
# habitat_types 生境类型：阔叶林 / 针叶林 / 草地林缘 / 树木腐木，用于按生境分类
# hosts      共生或寄生的树种 / 基物，用于"环境题"
# features   识别要点，按可靠程度排序，用于"细节题"
# lookalikes 危险易混种的 name，必须在本文件中也有条目
# zh_check   中文名待核对
#
# 可食性只是训练标签，不是食用许可：任何蘑菇吃之前都要当面鉴定。

# ───────────────────────── 可食 / 需熟食 / 新手不吃 ─────────────────────────

[[species]]
