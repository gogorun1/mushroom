# 术语的实物照片（人工维护）
#
# 每张照片是一条 iNaturalist 观察里的 CC 授权照片，用 scripts/term_photos.py 拉取署名和尺寸，
# 输出 data/term_photos.json。不用 ND（禁止演绎）授权的照片，因为网页会在照片上画高亮、裁切。
# 鉴定到种的观察必须是研究级；只鉴定到属或组的观察，说明文字也只说到属或组。
#
# id       iNat 照片 id（照片 URL 里 /photos/ 后面的数字）
# obs      这张照片所在的 iNat 观察 id
# taxon    观察现在的学名，拉取时核对；iNat 上改了鉴定会报错
# zh       中文名
# mark.X   在照片上标出术语 X（glossary.js 里的 id）：
#   at     高亮椭圆 [中心 x, 中心 y, 半宽, 半高]，都按照片宽、高的比例（0–1）
#   view   可选，术语卡里只显示这一块 [左, 上, 右, 下]，比例；不写就显示整张
#   note   照片下面的说明：这张照片上看什么
#   others 可选，自测题「照片上圈出来的地方，对应哪个词？」的错误选项（术语 id）。只挑在这张照片上
#          明显不对的词：圈里也能看到的部位、意思相近的词都不要写。不写就不出这道题；
#          同一处圈了两个词的，只给其中一个写。
#
# 一个术语有几张照片时，按这个文件里的先后顺序显示。

